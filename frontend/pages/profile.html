<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | The Beauty Salon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        :root{
            --black:#080808;
            --dark:#111111;
            --card:#151515;
            --gold:#D4AF37;
            --gold-light:#E5C65A;
            --white:#fff;
            --gray:#aaa;
            --border:rgba(212,175,55,.22);
        }

        *{box-sizing:border-box;margin:0;padding:0}
        body{
            min-height:100vh;
            background:var(--black);
            color:var(--white);
            font-family:"DM Sans",sans-serif;
        }
        a{text-decoration:none;color:inherit}

        .header{
            height:76px;
            border-bottom:1px solid var(--border);
            background:#090909;
            display:flex;
            align-items:center;
        }
        .header-inner{
            width:min(1180px,calc(100% - 32px));
            margin:auto;
            display:flex;
            align-items:center;
            justify-content:space-between;
        }
        .brand{
            display:flex;
            align-items:center;
            gap:12px;
        }
        .brand-icon{
            width:42px;height:42px;
            border:1px solid var(--gold);
            border-radius:50%;
            display:grid;
            place-items:center;
            color:var(--gold);
        }
        .brand-text strong{
            display:block;
            font-family:"Playfair Display",serif;
            font-size:18px;
        }
        .brand-text span{
            display:block;
            color:var(--gold);
            font-size:10px;
            letter-spacing:3px;
            text-transform:uppercase;
        }
        .back-link{
            color:var(--gray);
            font-size:14px;
            transition:.2s;
        }
        .back-link:hover{color:var(--gold)}

        .page{
            width:min(900px,calc(100% - 30px));
            margin:55px auto 80px;
        }
        .heading{text-align:center;margin-bottom:32px}
        .heading small{
            color:var(--gold);
            letter-spacing:3px;
            font-size:11px;
            font-weight:700;
        }
        .heading h1{
            font-family:"Playfair Display",serif;
            font-size:42px;
            margin:8px 0;
        }
        .heading h1 span{color:var(--gold)}
        .heading p{color:var(--gray);font-size:14px}

        .profile-card{
            background:linear-gradient(145deg,#171717,#101010);
            border:1px solid var(--border);
            border-radius:18px;
            padding:34px;
            box-shadow:0 20px 60px rgba(0,0,0,.35);
        }
        .profile-top{
            display:flex;
            align-items:center;
            gap:18px;
            padding-bottom:26px;
            margin-bottom:28px;
            border-bottom:1px solid rgba(255,255,255,.08);
        }
        .avatar{
            width:64px;height:64px;
            border-radius:50%;
            display:grid;
            place-items:center;
            background:rgba(212,175,55,.1);
            border:1px solid var(--gold);
            color:var(--gold);
            font-size:24px;
        }
        .profile-top h2{font-size:20px}
        .profile-top p{color:var(--gray);font-size:13px;margin-top:4px}

        .form-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
        }
        .field label{
            display:block;
            color:#ddd;
            font-size:13px;
            margin-bottom:8px;
            font-weight:600;
        }
        .field input{
            width:100%;
            height:48px;
            padding:0 14px;
            border:1px solid rgba(255,255,255,.12);
            border-radius:9px;
            background:#0c0c0c;
            color:white;
            outline:none;
            font-family:inherit;
            transition:.2s;
        }
        .field input:focus{
            border-color:var(--gold);
            box-shadow:0 0 0 3px rgba(212,175,55,.08);
        }
        .field input[readonly]{color:#999;cursor:not-allowed}

        .actions{
            display:flex;
            justify-content:flex-end;
            margin-top:28px;
        }
        .update-btn{
            border:0;
            background:linear-gradient(135deg,var(--gold),var(--gold-light));
            color:#090909;
            min-width:175px;
            height:48px;
            padding:0 22px;
            border-radius:9px;
            font-weight:700;
            cursor:pointer;
            font-family:inherit;
            transition:.2s;
        }
        .update-btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
        .message{
            display:none;
            margin-top:18px;
            padding:12px 14px;
            border-radius:8px;
            font-size:13px;
        }
        .message.success{
            display:block;
            color:#dff7df;
            background:rgba(50,150,70,.12);
            border:1px solid rgba(80,190,90,.25);
        }
        .message.error{
            display:block;
            color:#ffdede;
            background:rgba(180,50,50,.12);
            border:1px solid rgba(220,80,80,.25);
        }


        .account-wrap{position:relative}
        .account-btn{
            height:42px;
            padding:0 15px;
            border:1px solid rgba(212,175,55,.35);
            border-radius:9px;
            background:#111;
            color:#fff;
            display:flex;
            align-items:center;
            gap:9px;
            cursor:pointer;
            font-family:inherit;
            font-size:13px;
            font-weight:600;
            transition:.2s;
        }
        .account-btn:hover{
            border-color:var(--gold);
            background:#151515;
        }
        .account-btn > i:first-child{color:var(--gold)}
        .account-chevron{
            font-size:10px;
            color:#999;
            transition:.2s;
        }
        .account-wrap.open .account-chevron{transform:rotate(180deg)}
        .account-menu{
            position:absolute;
            top:calc(100% + 10px);
            right:0;
            width:190px;
            padding:7px;
            background:#151515;
            border:1px solid var(--border);
            border-radius:11px;
            box-shadow:0 18px 45px rgba(0,0,0,.45);
            display:none;
            z-index:1000;
        }
        .account-wrap.open .account-menu{display:block}
        .account-menu a,
        .account-menu button{
            width:100%;
            min-height:40px;
            padding:0 11px;
            border:0;
            background:transparent;
            color:#eee;
            border-radius:7px;
            display:flex;
            align-items:center;
            gap:10px;
            font-family:inherit;
            font-size:13px;
            text-align:left;
            cursor:pointer;
        }
        .account-menu a:hover,
        .account-menu button:hover{
            background:rgba(212,175,55,.08);
            color:var(--gold-light);
        }
        .account-menu i{
            width:16px;
            color:var(--gold);
            text-align:center;
        }
        .menu-divider{
            height:1px;
            margin:6px 4px;
            background:rgba(255,255,255,.08);
        }

        @media(max-width:650px){
            .header{height:68px}
            .header-inner{width:calc(100% - 24px)}
            .account-btn{height:40px;padding:0 11px}
            .account-btn span{display:none}
            .page{margin-top:38px}
            .heading h1{font-size:32px}
            .profile-card{padding:23px 18px}
            .form-grid{grid-template-columns:1fr}
            .actions{justify-content:stretch}
            .update-btn{width:100%}
        }
    

/* =========================================================

========================================================= */

        * { box-sizing: border-box; }

        .brand-name { display: flex; flex-direction: column; line-height: 1; }
        .brand-name strong { font-family: "Playfair Display", serif; font-size: 19px; }

        .desktop-navigation { display: flex; gap: 24px; }

            color: #ccc; text-decoration: none; font-size: 13px; font-weight: 600;
        }
        .desktop-navigation a:hover, .desktop-navigation a.active { color: #D4AF37; }

        .account-wrap { position: relative; }
        .account-button {
            min-height: 42px; padding: 0 15px; border: 1px solid #D4AF37;
            border-radius: 8px; background: #D4AF37; color: #000;
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            font: 700 13px "DM Sans", sans-serif;
        }
        .account-menu {
            position: absolute; top: calc(100% + 10px); right: 0;
            width: 225px; padding: 8px; background: #111;
            border: 1px solid rgba(212,175,55,.3); border-radius: 10px;
            box-shadow: 0 18px 45px rgba(0,0,0,.6); display: none;
        }
        .account-menu.show { display: block; }
        .account-menu a, .logout-btn {
            width: 100%; min-height: 42px; padding: 0 11px;
            display: flex; align-items: center; gap: 10px;
            border: 0; border-radius: 6px; background: transparent;

        }
        .account-menu a:hover, .logout-btn:hover {

        .account-menu i { width: 17px; color: #D4AF37; text-align: center; }
        .menu-divider { height: 1px; margin: 6px 3px; background: rgba(255,255,255,.08); }

                .page-hero {
            padding: 78px 20px 48px; text-align: center;
            background: radial-gradient(circle at top, rgba(212,175,55,.12), transparent 48%);
        }
        .eyebrow { color: #D4AF37; font-size: 12px; font-weight: 700; letter-spacing: 2.5px; }
        .page-hero h1 {
            margin: 12px 0 10px; font: 600 clamp(34px, 5vw, 54px) "Playfair Display", serif;
        }
        .page-hero p { margin: 0 auto; max-width: 620px; color: #aaa; font-size: 14px; }

        .container { width: min(1120px, calc(100% - 32px)); margin: auto; }
        .content { padding: 15px 0 80px; }

        .state {
            padding: 55px 20px; text-align: center;
            border: 1px solid rgba(212,175,55,.16); border-radius: 14px;
            background: #101010; color: #aaa;
        }
        .state i { font-size: 30px; color: #D4AF37; margin-bottom: 14px; }
        .state h2 { color: #fff; margin: 5px 0 8px; font-size: 21px; }
        .state p { margin: 0 0 20px; }
        .gold-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            min-height: 43px; padding: 0 18px; border-radius: 7px;
            background: #D4AF37; color: #000; text-decoration: none;
            font-weight: 700; font-size: 13px;
        }

        .history-list { display: grid; gap: 16px; }
        .booking-card {
            background: #111; border: 1px solid rgba(212,175,55,.18);
            border-radius: 14px; overflow: hidden;
        }
        .booking-head {
            padding: 17px 20px; display: flex; align-items: center;
            justify-content: space-between; gap: 15px;
            border-bottom: 1px solid rgba(255,255,255,.07);
        }
        .booking-number { color: #D4AF37; font-weight: 700; font-size: 14px; }
        .status {
            padding: 6px 10px; border-radius: 20px; font-size: 11px;
            font-weight: 700; letter-spacing: .5px;
        }
        .status-confirmed, .status-completed { color: #8ee7a4; background: rgba(80,190,100,.1); }
        .status-cancelled { color: #ff9999; background: rgba(220,70,70,.1); }
        .status-default { color: #D4AF37; background: rgba(212,175,55,.1); }

        .booking-body {
            padding: 20px; display: grid;
            grid-template-columns: 1.2fr 1fr 1fr 1fr; gap: 20px;
        }
        .service-name { color: #fff; font-size: 18px; font-weight: 700; margin-bottom: 7px; }
        .booking-price { color: #D4AF37; font-weight: 700; font-size: 18px; }
        .label { color: #777; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .value { color: #ddd; font-size: 13px; line-height: 1.5; }

        .payment {
            margin: 0 20px 18px; padding: 11px 13px;
            border-radius: 7px; background: rgba(255,255,255,.035);
            display: flex; flex-wrap: wrap; gap: 8px 22px; color: #aaa; font-size: 12px;
        }
        .payment strong { color: #ddd; }

                @media (max-width: 900px) {
                        .booking-body { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 600px) {
            .header-container { min-height: 68px; width: min(100% - 22px, 1180px); }
                        .page-hero { padding: 55px 16px 35px; }

            .booking-body { grid-template-columns: 1fr; gap: 14px; }
            .booking-head { align-items: flex-start; flex-direction: column; }
            .payment { margin-left: 14px; margin-right: 14px; }

        /* =========================================================

        .brand-logo {

<script>
/* =========================================================
   CUSTOMER LOGIN REQUIRED FOR PROFILE PAGE
   ========================================================= */
(function () {
    "use strict";

    function readJson(key) {
        try {
            const raw =
                localStorage.getItem(key) ||
                sessionStorage.getItem(key);
            return raw ? JSON.parse(raw) : null;
        } catch (error) {
            return null;
        }
    }

    function isCustomerLoggedIn() {
        const session = readJson("salon_customer_session");
        const customer = readJson("salon_customer");
        const legacyToken =
            localStorage.getItem("customerToken") ||
            sessionStorage.getItem("customerToken");

        return Boolean(
            (session && session.token && (session.customer || customer)) ||
            legacyToken
        );
    }

    if (!isCustomerLoggedIn()) {
        const currentUrl =
            window.location.pathname.split("/").pop() +
            window.location.search;

        window.location.replace(
            "login.html?redirect=" + encodeURIComponent(currentUrl)
        );
    }
})();
</script>

<script>
(function () {
    "use strict";

    function getSession() {
        try {
            const raw =
                localStorage.getItem("salon_customer_session") ||
                sessionStorage.getItem("salon_customer_session");

            if (!raw) return null;

            const session = JSON.parse(raw);
            if (!session || !session.token) return null;
            return session;
        } catch (e) {
            return null;
        }
    }

    function clearSession() {
        localStorage.removeItem("salon_customer_session");
        sessionStorage.removeItem("salon_customer_session");
        localStorage.removeItem("salon_customer");
        sessionStorage.removeItem("salon_customer");
    }

    const session = getSession();

    if (!session) {
        window.location.href = "login.html";
        return;
    }

    const customer = session.customer || {};
    const stored = localStorage.getItem("salon_customer");
    let storedCustomer = {};

    if (stored) {
        try {
            storedCustomer = JSON.parse(stored) || {};
        } catch (e) {}
    }

    const name = customer.name || storedCustomer.name || "My Account";
    const accountName = document.getElementById("accountName");

    if (accountName) {
        accountName.textContent =
            name.length > 20 ? name.substring(0, 20) + "…" : name;
    }

    const accountButton = document.getElementById("accountButton");
    const accountMenu = document.getElementById("accountMenu");

    if (accountButton && accountMenu) {
        accountButton.addEventListener("click", function (event) {
            event.stopPropagation();
            accountMenu.classList.toggle("show");
        });

        document.addEventListener("click", function () {
            accountMenu.classList.remove("show");
        });
    }

    const logoutButton = document.getElementById("logoutButton");

    if (logoutButton) {
        logoutButton.addEventListener("click", function () {
            clearSession();
            window.location.href = "../index.html";
        });
    }

    const menuBtn = document.getElementById("menuBtn");
    const closeMenuBtn = document.getElementById("closeMenuBtn");
    const mobileMenu = document.getElementById("mobileMenu");

    function openMobileMenu() {
        if (!mobileMenu) return;

        mobileMenu.classList.add("open");
        mobileMenu.setAttribute("aria-hidden", "false");

        if (menuBtn) {
            menuBtn.setAttribute("aria-expanded", "true");
        }

        document.body.style.overflow = "hidden";
    }

    function closeMobileMenu() {
        if (!mobileMenu) return;

        mobileMenu.classList.remove("open");
        mobileMenu.setAttribute("aria-hidden", "true");

        if (menuBtn) {
            menuBtn.setAttribute("aria-expanded", "false");
        }

        document.body.style.overflow = "";
    }

    if (menuBtn) {
        menuBtn.addEventListener("click", openMobileMenu);
    }

    if (closeMenuBtn) {
        closeMenuBtn.addEventListener("click", closeMobileMenu);
    }

    const mobileLogoutButton = document.getElementById("mobileLogoutButton");

    if (mobileLogoutButton) {
        mobileLogoutButton.addEventListener("click", function (event) {
            event.preventDefault();
            clearSession();
            window.location.href = "../index.html";
        });
    }

    if (mobileMenu) {
        mobileMenu.querySelectorAll("a:not(#mobileLogoutButton)").forEach(function (link) {
            link.addEventListener("click", closeMobileMenu);
        });
    }

    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
            closeMobileMenu();
        }
    });
})();
</script>

<script>
(function () {
    const API = "http://localhost:5000/api";
    const form = document.getElementById("profileForm");
    const nameInput = document.getElementById("fullName");
    const mobileInput = document.getElementById("mobile");
    const emailInput = document.getElementById("email");
    const profileName = document.getElementById("profileName");
    const message = document.getElementById("message");

    function getSession() {
        try {
            const raw =
                localStorage.getItem("salon_customer_session") ||
                sessionStorage.getItem("salon_customer_session");

            if (!raw) return null;
            return JSON.parse(raw);
        } catch {
            return null;
        }
    }

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    const session = getSession();

    if (!session || !session.token || !session.customer) {
        window.location.href = "login.html";
        return;
    }

    const customer = session.customer;

    nameInput.value = customer.name || "";
    mobileInput.value = customer.phone || "";
    emailInput.value = customer.email || "";
    profileName.textContent = customer.name || "Customer";

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const updatedName = nameInput.value.trim();
        const updatedEmail = emailInput.value.trim();

        if (!updatedName) {
            showMessage("Please enter your full name.", "error");
            return;
        }

        try {
            const response = await fetch(API + "/auth/profile", {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + session.token
                },
                body: JSON.stringify({
                    fullName: updatedName,
                    email: updatedEmail
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Unable to update profile.");
            }

            const updatedCustomer = data.customer;

            session.customer = updatedCustomer;

            const storage =
                localStorage.getItem("salon_customer_session")
                    ? localStorage
                    : sessionStorage;

            storage.setItem(
                "salon_customer_session",
                JSON.stringify(session)
            );

            localStorage.setItem(
                "salon_customer",
                JSON.stringify(updatedCustomer)
            );

            profileName.textContent = updatedCustomer.name || "Customer";
            showMessage("Profile updated successfully.", "success");

        } catch (error) {
            showMessage(
                error.message || "Unable to update profile.",
                "error"
            );
        }
    });
})();
</script>
